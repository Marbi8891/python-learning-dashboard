# Pruebas QA de Python. Se ejecutan desde la raíz del repositorio:
#   python -m pytest tests/backend tests/integration tests/security
# (las del backend de siempre siguen en backend/tests con su configuración)
[pytest]
testpaths = backend integration security
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient.:UserWarning
