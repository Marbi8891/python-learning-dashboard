# Publica la carpeta frontend/ en GitHub Pages
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/security/production_csp.py"
      - "scripts/web/vendor_pyodide.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Construye la web y la sube como artefacto. El despliegue va en otro job: deploy-pages busca el artefacto
  # en la API de Actions y, en el mismo job que lo subió, a veces aún no lo ve («Found 0 artifact(s)»,
  # 19/11/2026). Es la estructura que recomienda la documentación de actions/deploy-pages.
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # Python (Pyodide) se publica con la web, sin CDN (RT-002): vendor_pyodide.py descarga el paquete npm
      # de package-lock.json, comprueba su huella sha512 y la sha256 de cada archivo antes de copiarlo
      - name: Python en la web
        run: python3 scripts/web/vendor_pyodide.py frontend
      # La copia publicada no lleva los orígenes de desarrollo (localhost:8000) en la CSP.
      # Solo cambia el artefacto, no el repositorio; falla si cambiaría otra cosa.
      - name: CSP de producción
        run: python3 scripts/security/production_csp.py frontend
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
