# Publica la carpeta frontend/ en GitHub Pages
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/security/production_csp.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # La copia publicada no lleva los orígenes de desarrollo (localhost:8000) en la CSP
      # (PLD-SEC-003). Solo cambia el artefacto, no el repositorio; falla si cambiaría otra cosa.
      - name: CSP de producción
        run: python3 scripts/security/production_csp.py frontend
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v5
