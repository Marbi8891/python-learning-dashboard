# Seguridad: secretos (Gitleaks), análisis estático (Bandit), vulnerabilidades de dependencias
# (pip-audit y npm audit) y pruebas de seguridad (CSP, cookies, autorización, entradas).
# Mismo script que en local: scripts/qa/security_scan.sh (docs/QA_GUIDE.md).
# Cada semana se repite sobre main: las bases de datos de vulnerabilidades cambian aunque el código no.
name: Security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"   # lunes a las 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QA_STRICT: "1"
  NO_COLOR: "1"
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  scan:
    name: Secretos, análisis estático y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # Gitleaks revisa los commits nuevos de la rama
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Herramientas (versiones fijas)
        run: |
          pip install -r backend/requirements-dev.txt "pip-audit==2.10.1" "bandit==1.9.4"
          npm ci
          # Gitleaks: binario oficial comprobado con su SHA-256 (sin acciones de terceros)
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Análisis de seguridad
        env:
          # En un PR, Gitleaks revisa los commits del PR; en main/develop y cada semana, todo el historial
          QA_BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$QA_BASE" ]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml . || exit 1
          fi
          bash scripts/qa/security_scan.sh --keep-going
      - name: Resumen
        if: ${{ !cancelled() }}
        run: test -f reports/qa/security-report.md && cat reports/qa/security-report.md >> "$GITHUB_STEP_SUMMARY" || true
      # Solo resultados sin valores de secretos (Gitleaks va con --redact)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: security-report
          path: reports/qa/
          retention-days: 30
