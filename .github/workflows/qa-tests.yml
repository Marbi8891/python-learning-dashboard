# Entorno QA: validaciones que ci.yml no hace (ci.yml sigue siendo la batería principal:
# backend con cobertura, e2e, WebKit y cursos). Aquí, sin repetir nada de ci.yml:
#   frontend: sintaxis, imports/exports, recursos, HTML, CSS, validador y Web Workers en Chromium
#   python-qa: contrato de la API, autorización, errores, dependencias, integración frontend-backend
#              y pruebas de seguridad (tests/backend, tests/integration, tests/security)
#   git: rama, archivos modificados (pruebas borradas o saltadas, JSON generados a mano) y conflictos
#   informe: junta los resultados en reports/qa/latest-report.md (artefacto y resumen del job)
# Mismo código que en local: cada paso llama a scripts/qa/checks.sh (docs/QA_GUIDE.md).
name: QA tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la ejecución anterior; en main y develop no se cancela nada
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QA_STRICT: "1"      # una herramienta que falta es un fallo, no un SKIP
  NO_COLOR: "1"

jobs:
  git:
    name: Git (rama, cambios y conflictos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # historial completo: merge-base con la rama base
          persist-credentials: false
      - name: Rama del pull request
        if: github.event_name == 'pull_request'
        run: bash scripts/qa/ci-step.sh branch "Rama del pull request" check_branch
      - name: Archivos modificados
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh changed-files "Archivos modificados" check_changed_files
      - name: Conflictos de Git
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh conflicts "Conflictos de Git" check_conflicts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: qa-git
          path: reports/qa/
          retention-days: 7

  frontend:
    name: Frontend (JS, HTML, CSS y Web Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # solo para el servidor estático de las pruebas de navegador
      - run: npm ci
      - name: JavaScript (sintaxis, imports, exports, Workers y recursos)
        run: bash scripts/qa/ci-step.sh frontend-static "JavaScript (sintaxis, imports y recursos)" check_frontend_static
      - name: Validación HTML
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh lint-html "Validación HTML" check_lint_html
      - name: Validación CSS
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh lint-css "Validación CSS" check_lint_css
      - name: Tests del validador, HTML y CSS
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh qa-frontend "Tests del validador del frontend" check_qa_frontend
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - name: Módulos y Web Workers en Chromium (con Pyodide real si hay red)
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh browser-frontend "Módulos y Web Workers en Chromium" check_browser_frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: qa-frontend
          path: |
            reports/qa/
            test-results/qa-frontend/
          retention-days: 7

  python-qa:
    name: Backend, integración y seguridad (QA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint y formato (incluye tests/ del entorno QA)
        run: |
          bash scripts/qa/ci-step.sh lint-python "Lint de Python (ruff)" check_ruff
          bash scripts/qa/ci-step.sh format-python "Formato de Python (ruff)" check_ruff_format
      - name: Contrato de la API, autorización, errores y dependencias
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh qa-python "Contrato de la API y errores" check_qa_python
      - name: Integración frontend-backend
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh integration "Integración frontend-backend" check_integration
      - name: Pruebas de seguridad
        if: ${{ !cancelled() }}
        run: bash scripts/qa/ci-step.sh security-tests "Pruebas de seguridad" check_security_tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: qa-python
          path: reports/qa/
          retention-days: 7

  report:
    name: Informe de QA
    needs: [git, frontend, python-qa]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qa-*
          path: qa-parts
      - name: Juntar resultados y generar el informe
        run: |
          mkdir -p reports/qa/logs
          find qa-parts -name results.jsonl -exec cat {} + > reports/qa/results.jsonl
          find qa-parts -path '*/logs/*.log' -exec cp {} reports/qa/logs/ \;
          python3 scripts/qa/report.py --title "QA tests · ${{ github.event_name }} · ${{ github.ref_name }}" --no-actions
          cat reports/qa/latest-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report
          path: reports/qa/latest-report.md
          retention-days: 30
      - name: Resultado final
        run: |
          verdict="$(sed -n 's/^\*\*Resultado final: \(.*\)\*\*$/\1/p' reports/qa/latest-report.md)"
          echo "Resultado: $verdict"
          test "$verdict" != "FAIL"
