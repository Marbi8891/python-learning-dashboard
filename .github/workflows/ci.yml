# Calidad en cada push y pull request:
#   backend: lint, formato, tests con cobertura del 100 % y migraciones en PostgreSQL
#   cursos: el temario de los cursos de DAW, con cada respuesta comprobada
#   e2e: la app completa (frontend + backend reales) en Chromium, con auditoría WCAG
name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token de GitHub solo puede leer el repositorio
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pld
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # el token no se queda en .git/config al instalar dependencias
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . ../e2e ../scripts
      - name: Formato (ruff)
        run: ruff format --check . ../e2e ../scripts
      - name: Dependencias sin vulnerabilidades conocidas (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Tests (SQLite) con cobertura mínima del 100 %
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=100
      - name: Contenido del núcleo educativo al día y con cada respuesta comprobada
        run: python ../scripts/learning/build_learning.py --check
      - name: Catálogo del currículo de DAW al día
        run: python ../scripts/curriculum/build_curriculum.py --check
      - name: Migraciones en PostgreSQL (vacía y con datos existentes)
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pld
        run: python -m pytest -q tests/test_migrations.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # el token no se queda en .git/config al instalar dependencias
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios del frontend (dominio, repaso, recomendación y sesiones)
        run: npm run test:unit
      - name: Dependencias de npm sin vulnerabilidades altas
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Tests end-to-end
        run: npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Cursos de DAW: cada respuesta se comprueba ejecutando el código de verdad (SQLite, Node, Java y Python)
  cursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cursos al día y respuestas comprobadas
        run: |
          python3 scripts/courses/sql_course.py --check
          python3 scripts/courses/js_course.py --check
          python3 scripts/courses/java_course.py --check
          python3 scripts/courses/entornos_course.py --check
          python3 scripts/courses/programacion_course.py --check
