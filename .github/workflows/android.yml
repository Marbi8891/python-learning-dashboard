# App Android nativa (ADR-0011): tests del dominio, lint de Android y APK instalable.
# APK de depuración: «Artifacts» → python-pcap-apk.
# APK de release firmado (ADR-0013): «Artifacts» → python-pcap-release. Solo se genera si
# existen los secretos PLD_KEYSTORE_BASE64, PLD_KEYSTORE_PASSWORD y PLD_KEY_ALIAS.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "frontend/data/**", "scripts/courses/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "frontend/data/**", "scripts/courses/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# El token de GitHub solo puede leer el repositorio (ADR-0022)
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PLD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # El wrapper de Gradle es un binario del repositorio: se comprueba que es el oficial
      # antes de ejecutarlo (y, con él, de tener los secretos de firma en el entorno)
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Desde Windows, git puede guardar gradlew sin permiso de ejecución
      - run: chmod +x gradlew
      # Cursos de DAW (ADR-0016): cada respuesta se comprueba ejecutando el código de verdad
      - name: Cursos al día y respuestas comprobadas
        working-directory: .
        run: |
          python3 scripts/courses/sql_course.py --check
          python3 scripts/courses/js_course.py --check
          python3 scripts/courses/java_course.py --check
          python3 scripts/courses/entornos_course.py --check
          python3 scripts/courses/programacion_course.py --check
      - name: Tests del dominio (banco, repaso espaciado, preparación, fusión)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint de Android
        run: ./gradlew --no-daemon lintDebug
      - name: APK de depuración
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: python-pcap-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # La clave solo existe en el disco temporal del runner durante esta ejecución
      - name: APK de release firmado
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request'
        env:
          PLD_KEYSTORE_BASE64: ${{ secrets.PLD_KEYSTORE_BASE64 }}
          PLD_KEYSTORE_PASSWORD: ${{ secrets.PLD_KEYSTORE_PASSWORD }}
          PLD_KEY_ALIAS: ${{ secrets.PLD_KEY_ALIAS }}
          PLD_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          printf %s "$PLD_KEYSTORE_BASE64" | tr -d "\r\n " | base64 --decode > "$PLD_KEYSTORE_PATH"
          trap 'rm -f "$PLD_KEYSTORE_PATH"' EXIT  # se borra aunque falle la compilación
          ./gradlew --no-daemon assembleRelease
          # Comprueba la firma (falla si no es válida) y muestra la huella SHA-256 del certificado
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: python-pcap-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
