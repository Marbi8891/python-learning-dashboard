# App Android nativa (ADR-0011): tests del dominio, lint de Android y APK instalable.
# El APK de depuración se descarga desde la ejecución, en «Artifacts» → python-pcap-apk.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "frontend/data/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "frontend/data/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Desde Windows, git puede guardar gradlew sin permiso de ejecución
      - run: chmod +x gradlew
      - name: Tests del dominio (banco, repaso espaciado, preparación, fusión)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint de Android
        run: ./gradlew --no-daemon lintDebug
      - name: APK de depuración
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: python-pcap-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
