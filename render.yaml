# Blueprint de Render: backend (Docker) en Frankfurt (UE).
# La base de datos es PostgreSQL en Neon (plan gratuito permanente, región UE): ver ADR-0008.
# Uso: render.com → New → Blueprint → elige este repositorio. Guía: docs/DEPLOY.md
# Plan gratuito de Render (sept. 2026): el servicio se suspende tras 15 min sin tráfico
# y tarda ~1 min en despertar; 750 h de instancia al mes.
services:
  - type: web
    name: pld-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Cadena de conexión de Neon (postgresql://...?sslmode=require). Se pega en el panel.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://marbi8891.github.io"]'
      - key: FRONTEND_URL
        value: https://marbi8891.github.io/python-learning-dashboard
      # Recuperación de contraseña por email: rellénalos en el panel de Render
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
