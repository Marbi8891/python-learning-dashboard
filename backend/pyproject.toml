[project]
name = "python-learning-dashboard-api"
version = "0.7.1"
description = "API del Python Learning Dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores · I: orden de imports · B: bugs típicos · UP: sintaxis moderna
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el patrón de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Aviso interno de starlette sobre su cliente de tests; no afecta a la API
    "ignore:Using .httpx. with .starlette.testclient.:UserWarning",
]
